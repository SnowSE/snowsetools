apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: simple-syllabus-reporter
      spec:
        template:
          spec:
            containers:
              - name: app
                env:
                  - name: PHX_HOST
                    value: "simplesyllabuscheck.snowse.io"

    target:
      kind: Deployment
      name: simple-syllabus-reporter
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: simple-syllabus
      spec:
        parentRefs:
          - name: main-gateway
            namespace: istio-system
        hostnames:
          - "simplesyllabuscheck.snowse.io"
    target:
      kind: HTTPRoute
      name: simple-syllabus
