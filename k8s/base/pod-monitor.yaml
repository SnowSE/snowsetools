apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: simple-syllabus-envoy
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - simple-syllabus
  selector:
    matchLabels:
      app: simple-syllabus-reporter
  podMetricsEndpoints:
    - targetPort: 15090
      path: /stats/prometheus
      interval: 15s
