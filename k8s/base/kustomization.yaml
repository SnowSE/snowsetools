apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: simple-syllabus

resources:
  - namespace.yaml
  - sealed-secret.yaml
  - postgres.yaml
  - app.yaml
  - gateway.yaml

configMapGenerator:
  - name: schema-sql
    files:
      - schema.sql
    options:
      disableNameSuffixHash: true
