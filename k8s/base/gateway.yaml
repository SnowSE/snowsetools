apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: simple-syllabus
  namespace: simple-syllabus
spec:
  parentRefs:
    - name: changed by kustomize
      namespace: istio-system
  hostnames:
    - "changed by kustomize"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app
          port: 4000
