apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: simple-syllabus
spec:
  selector:
    app: simple-syllabus-reporter
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-syllabus-reporter
  namespace: simple-syllabus
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: simple-syllabus-reporter
  template:
    metadata:
      labels:
        app: simple-syllabus-reporter
    spec:
      containers:
        - name: webapp
          image: ghcr.io/alexmickelson/simple-syllabus-reporter:51
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: PHX_HOST
              value: "changed by kustomize"
            - name: OIDC_REDIRECT_URI
              value: "changed by kustomize"
            - name: AI_MODEL
              value: "qwen3-6-35b-q6"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
