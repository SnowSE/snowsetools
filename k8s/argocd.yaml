apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-syllabus-reporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alexmickelson/simpleSyllabusReporter
    targetRevision: HEAD
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: simple-syllabus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
